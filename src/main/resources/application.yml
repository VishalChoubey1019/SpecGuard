spring:
  application:
    name: specguard

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/specguard}
    username: ${DB_USER:specguard}
    password: ${DB_PASSWORD:specguard}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# --- App-specific config & secrets (all from env, loaded via .env in local dev) ---
specguard:
  jwt:
    secret: ${JWT_SECRET:change-me-in-.env-this-default-is-not-safe-for-anything-real}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
    app-token: ${GITHUB_APP_TOKEN:}

  jira:
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}

  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}

  llm:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
