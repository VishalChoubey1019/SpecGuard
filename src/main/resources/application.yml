spring:
  application:
    name: specguard

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/specguard}
    username: ${DB_USER:specguard}
    password: ${DB_PASSWORD:specguard}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.specguard: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: INFO

specguard:
  jwt:
    secret: ${JWT_SECRET:change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

  frontend:
    origins: ${FRONTEND_ORIGINS:http://localhost:3000}

  github:
    app-id: ${GITHUB_APP_ID:}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH:}
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}

  jira:
    base-url: ${JIRA_BASE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}

  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}

  governance:
    oasdiff-path: ${OASDIFF_PATH:oasdiff}

  llm:
    anthropic-api-key: ${ANTHROPIC_API_KEY:}